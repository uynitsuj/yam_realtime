version: "1"

# Bimanual YAM deployment for the Siemens industrial-packing pi0.5 checkpoints
# on the Shenzhen ZED-top stations (yam_zed_0_61: sz_43 / sz_48 / sz_50).
#
# ── This config exists to reproduce the TRAINING-TIME top-camera crop ────────
#
# The v2/v3 Siemens datasets crop the ZED top view to match the D405 station's
# FOV (78.7° x 63.2°) before resizing. The window was placed by Karim in the
# interactive viewer (2026-08-26): bottom-anchored (nothing cropped off the
# bottom), center shifted 86.7 px right of the principal point (at fx=729).
# `publish_crop_rect` below applies the SAME pixel rect the converters used, so
# what the policy sees at deployment is what it saw in training.
#
# Per-station rects (native 1920x1200 HD1200 frames, [x0, y0, w, h]):
#     sz_48: [435, 304, 1194, 896]   <- ACTIVE below (reference placement)
#     sz_43: [463, 280, 1226, 920]
#     sz_50: [453, 300, 1202, 900]
# For a new ZED station, recompute from its calibration:
#     w  = floor_to_even( 2 * fx * tan(78.7deg / 2) )
#     h  = floor_to_even( 2 * fy * tan(63.2deg / 2) )
#     xc = cx + fx * (86.7 / 729)          # angular offset, generalizes across fx
#     x0 = round(xc - w/2);  y0 = 1200 - h # bottom-anchored
# (sz_04 appeared 2026-08-28 and has not been visually checked yet.)
#
# ── Checkpoint-family conventions (abcloader v2/v3 configs) ──────────────────
#
#   - image_preprocess MUST be `pad` (training used resize_with_pad; the
#     us05/us07 box_abc checkpoints use center_crop — do not copy that here).
#   - Trained on COMMANDED actions in RAW joint order (no yam flip). Serve with
#     an openpi server running pi05_siemens_packing_abcloader_v{2,3}[_zedonly].
#   - Side (wrist) cameras are NOT cropped — training used them full-FOV.
#   - Top camera publishes the ZED LEFT eye (mono grab), renamed to `rgb` on
#     the bus so it flattens to `top_camera-images-rgb` — the exact key
#     YamInputs expects. Without the rename the policy silently gets a black
#     top image (keys mismatch -> masked out).

session:
  save_root: recordings/{policy_name}
  start_paused: true
  record_on_unpause: true
  episode_timeout: 240

nodes:
  - type: AgentNode
    name: openpi_policy
    agent_class: robots_realtime.agents.policy_learning.async_pi0_agent:AsyncDiffusionAgent
    agent_kwargs:
      ip: 127.0.0.1                        # openpi websocket server
      port: 8012
      action_horizon: 30                   # pi05 siemens configs: action_horizon=30 @ 30 Hz
      inference_mode: sync                 # sync | async | async_rate_limited | async_rtc | temporal_ensemble
      image_preprocess: pad                # MUST match training (resize_with_pad); see header
      use_joint_state_as_action: false
    state_topics:
      left:  yam_left/joint_state
      right: yam_right/joint_state
    image_topics:
      left_camera:  camera_left/rgb        # flatten -> left_camera-images-rgb
      right_camera: camera_right/rgb
      top_camera:   camera_top/rgb         # ZED left eye renamed to `rgb` by the camera node
    loop_mode: fixed_rate
    poll_freq: 30

  - type: RobotNode
    name: yam_left
    robot_config: robot_configs/yam/left.yaml
    cmd_topic: openpi_policy/left_pos
    poll_freq: 200
    ramp_duration_s: 1.5
    startup_joint_pos: [0.0, 0.4, 0.35, 0.35, 0.0, 0.0, 1.0]
    startup_duration_s: 2.0

  - type: RobotNode
    name: yam_right
    robot_config: robot_configs/yam/right.yaml
    cmd_topic: openpi_policy/right_pos
    poll_freq: 200
    ramp_duration_s: 1.5
    startup_joint_pos: [0.0, 0.4, 0.35, 0.35, 0.0, 0.0, 1.0]
    startup_duration_s: 2.0

  # ── Top camera: ZED (left eye), HD1200 to match the training pixel grid ────
  # publish_crop_rect is defined on the native 1920x1200 frame — if you change
  # `resolution`, the rect no longer matches training and the node will either
  # crop the wrong region or refuse to start. Do not change one without the
  # other. Bus payload only: the on-disk recording keeps the full sensor frame.
  - type: CameraNode
    name: camera_top
    driver: ZedCamera
    device_id: "SET_ME"                    # ZED serial for this station
    resolution: HD1200                     # 1920x1200 — same as training data
    fps: 30
    publish_image_key: rgb                 # left_rgb -> rgb (see header)
    publish_crop_rect: [435, 304, 1194, 896]   # sz_48; other stations: see header
    publish_resize: [224, 224]
    publish_resize_mode: pad               # MUST match agent image_preprocess
    publish_fov_crop: 1.0                  # rect crop replaces the fractional knob

  # ── Wrist cameras: full FOV (training did not crop side views) ─────────────
  - type: CameraNode
    name: camera_left
    driver: RealSenseCamera
    device_id: "SET_ME"                    # left wrist serial
    resolution: VGA
    fps: 30
    publish_resize: [224, 224]
    publish_resize_mode: pad
    publish_fov_crop: 1.0

  - type: CameraNode
    name: camera_right
    driver: RealSenseCamera
    device_id: "SET_ME"                    # right wrist serial
    resolution: VGA
    fps: 30
    publish_resize: [224, 224]
    publish_resize_mode: pad
    publish_fov_crop: 1.0

  # Live viser monitor — URDF overlays + camera panels, no commands.
  - type: ViserMonitorNode
    name: viz
    port: 8080
    viz_freq: 20
    preview_size: [224, 224]
    auto_open_browser: true
    fullscreen: true
    up_axis: "+z"
    initial_camera_position: [-0.7, -0.31, 0.3]
    initial_camera_look_at:  [0.45, -0.31, 0.3]
    chunk_topic: openpi_policy/chunk
    n_chunk_frames: 10
    chunk_frame_axes_length: 0.03
    urdfs:
      yam_left:
        path: dependencies/i2rt/i2rt/robot_models/arm/yam/yam.urdf
        state_topic: yam_left/joint_state
        flip_joints: true
        chunk_arm_key: left
        gripper:
          type: linear_4310
          attach_link: link_6
      yam_right:
        path: dependencies/i2rt/i2rt/robot_models/arm/yam/yam.urdf
        state_topic: yam_right/joint_state
        flip_joints: true
        chunk_arm_key: right
        gripper:
          type: linear_4310
          attach_link: link_6
        extrinsic:
          position: [0.0, -0.61, 0.0]
          rotation: [1.0, 0.0, 0.0, 0.0]
    image_topics:
      top:   openpi_policy/image/top_camera
      left:  openpi_policy/image/left_camera
      right: openpi_policy/image/right_camera
