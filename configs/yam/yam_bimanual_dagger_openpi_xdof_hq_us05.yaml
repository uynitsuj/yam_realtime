version: "1"

# DAgger intervention data collection: bimanual YAM policy rollout that the
# operator can take over mid-episode with the two passive GELLO leaders, correct
# by hand, and hand back — repeatedly, inside one recorded episode.
#
# Derived from yam_bimanual_openpi_policy_xdof_hq_us05.yaml. The differences are
# all in the command path: the policy no longer drives the arms directly.
#
#   openpi_policy/{left,right}_pos ─┐
#   passive gello CAN ──────────────┤→ dagger ─→ dagger/{left,right}_pos ─→ RobotNode
#   yam_{left,right}/joint_state ───┘             dagger/control_mode  (recorded label)
#
# The policy keeps publishing its own commands throughout, so during intervention
# openpi_policy/{arm}_pos is recorded as the counterfactual "what the policy
# would have done" — the target signal for DAgger training.
#
# Operator flow — both buttons are on the passive gellos, so a whole collection
# session runs without going back to the keyboard. Yellow on either leader acts
# on both arms; the lower episode button is intentionally limited to the left GELLO.
#   1. Set up the scene while the arms are still gated.
#   2. [space] in the TUI arms the robots: the policy takes the arms AND the
#      episode starts, so the rollout is captured from the instant of handoff.
#   3. YELLOW button (top, index 0) intervenes. The correction is a RELATIVE SE(3)
#      offset anchored at the press, so the followers do not snap to wherever the
#      leaders happen to be sitting. Press again to hand back — the policy's
#      stale action chunk is flushed and the command blended over
#      handback_blend_s. Toggle as often as needed within the episode.
#   4. WHITE button (lower, index 1) ends the episode, saves it, and walks the
#      arms back to home_joint_pos, where they park. Reset the scene in that
#      window, then press WHITE again to start the next rollout. After step 2 the
#      keyboard is not needed again.
#
#   Rollout cycle:
#     IDLE ──white──> POLICY <──yellow──> INTERVENTION
#     (parked            │                     │
#      at home)          │                  (yellow)
#         ^              │                     v
#         └──HOMING──white┘                HANDBACK ──> POLICY
#
#   [space] still works as a hard gate at any point: pausing ends the episode and
#   holds the arms where they are (RobotNode commands are gated, so they cannot
#   be driven home while paused); unpausing starts a fresh episode and blends the
#   arms back under policy control.
#
#   Button map (see dagger_intervention_agent.py for how the bits are decoded):
#     either TOP/YELLOW = takeover / hand back
#     left LOWER/WHITE  = episode start / end+save+home
#     right LOWER/WHITE = session play / pause (same as TUI [space])
# The TUI still works throughout: [r] saves the episode and requests homing,
# [d] discards the current episode, [space] re-pauses, [q] quits.
#
# Prereqs beyond the plain policy config:
#   - can_lead_l / can_lead_r up at 1 Mbit/s (xdof/scripts/reset_all_can.sh)
#   - all 7 encoder devices per leader powered and streaming 0x50F
#   - button indices confirmed with: uv run scripts/probe_gello_buttons.py
#     (prints the live byte with both indices labelled by position and colour)
#
# Bimanual YAM policy deployment via an external OpenPI websocket inference server.
# The policy agent runs inference on a background thread (inference_mode: async = flat-out);
# AgentNode's consumer calls act() at poll_freq and dequeues one action per tick from the
# chunk buffer. Smoothing across chunk boundaries is handled inside the agent.
#
# Prereqs:
#   - `openpi_client` installed in this venv.
#   - OpenPI server reachable at the (ip, port) below.
#   - can_left / can_right interfaces up at 1 Mbit/s.

session:
  # {policy_name} is resolved at startup by querying the OpenPI server's
  # websocket metadata (runtime/config.py:_resolve_policy_name). serve_policy.py
  # reports the served checkpoint's name — the named-checkpoint key, or
  # <config>/<run>/<step> for a raw ckpt — so each policy's rollouts land in
  # their own folder. Falls back to the literal template if the server is down.
  save_root: recordings/dagger/{policy_name}
  # start_paused: RobotNode commands are gated on startup so the arms don't snap
  # to wherever the policy thinks they should be. Set up the scene while gated,
  # then hit [space] or right LOWER/WHITE to hand the arms to the policy.
  start_paused: true
  # Session's own record_on_unpause MUST stay false — the dagger node replaces
  # it (its own record_on_unpause kwarg, on by default) so that ONE thing owns
  # episode boundaries. Session's version calls start_episode() directly without
  # advancing its _prev_record_signal, which desyncs the latch below and gets the
  # operator's next button press silently swallowed.
  record_on_unpause: false
  # Every episode boundary arrives on this topic from the dagger node, which
  # holds a latched boolean that Session edge-detects (False→True starts an
  # episode, True→False ends and saves it):
  #   [space] unpause  → episode starts   (unpausing IS the handoff — the policy
  #                                        begins driving, so recording has to
  #                                        start here or the rollout loses its head)
  #   [space] pause    → episode ends + saves
  #   left WHITE button → toggle an episode without touching pause
  record_topic: dagger/record
  # One-shot hardware equivalent of the TUI space bar, emitted by the DAgger
  # node from the right GELLO lower button.
  pause_toggle_topic: dagger/pause_toggle
  # Backstop only. On expiry Session ends the episode and re-pauses; the dagger
  # node sees that pause edge and drops its latch to match, so the next [space]
  # cleanly starts a fresh episode with no stray press needed.
  episode_timeout: 240

nodes:
  - type: AgentNode
    name: openpi_policy
    agent_class: robots_realtime.agents.policy_learning.async_pi0_agent:AsyncDiffusionAgent
    #
    # ── AsyncDiffusionAgent kwargs by mode ──────────────────────────────────
    #
    # Knob                    sync     async    async_rate_limited  async_rtc          temporal_ensemble
    # ─────────────────────────────────────────────────────────────────────────────────────────────────
    # action_horizon          used     used     used                used               used
    # inference_interval_s    ignored  opt cap  REQUIRED            ignored (sched.)   ignored
    # min/max_smoothed_actions N/A*    used     used                irrelevant†        N/A‡
    # rtc_execution_horizon   N/A      N/A      N/A                 used               N/A
    # rtc_consumer_rate_hz    N/A      N/A      N/A                 used (EMA)         N/A
    # rtc_max_guidance_weight N/A      N/A      N/A                 used (clamp)       N/A
    # temporal_ensemble_k     N/A      N/A      N/A                 N/A                used
    #
    #   * sync uses openpi's ActionChunkBroker which hard-swaps chunks; no
    #     client-side blend is applied.
    #   † in async_rtc the SERVER aligns new chunks to the action_prefix, so
    #     the client-side linear-ramp blend is redundant. Leaving the knobs
    #     at their defaults is fine — they run harmlessly on the tail of the
    #     new chunk where the server guidance weight is already 0.
    #   ‡ temporal_ensemble is paper-faithful (Zhao et al. ACT): blocking
    #     inference once per consumer tick, then exp(-k * age_index) weighted
    #     average across every chunk that covers tick t. No client-side blend;
    #     replaces the linear-ramp scheme entirely. Requires
    #     inference_time < 1/poll_freq for the consumer rate to hold;
    #     otherwise the loop runs as fast as inference allows.
    #
    # inference_interval_s is a rate cap for `async` only. For `async_rtc`
    # the SCHEDULED trigger paces inference (one per chunk cycle, fired
    # when the buffer has ≈ d_est actions left), which supersedes any rate
    # cap — inference_interval_s is ignored on this path.
    #
    # async_rtc REQUIRES the matching openpi fork with sample_actions_rtc
    # and obs["action_prefix"] plumbing (openpi/src/openpi/{policies/policy.py,
    # models/pi0.py}). With stock openpi, use async or async_rate_limited.
    # temporal_ensemble works against any openpi server (stock or fork).
    #
    agent_kwargs:
      ip: 127.0.0.1
      port: 8012
      action_horizon: 15
      inference_mode: sync                 # sync | async | async_rate_limited | async_rtc | temporal_ensemble
      # inference_interval_s: 0.7                 # rate cap in seconds (None = flat-out async)
      # min_smoothed_actions: 1                 # only meaningful for async / async_rate_limited
      # max_smoothed_actions: 10                # (ignored in sync and effectively unused in async_rtc)
      # temporal_ensemble_k: 0.05               # ACT paper default; higher = more weight on older predictions (smoother, laggier)
      # rtc_execution_horizon: 22               # async_rtc only; None → server's action_horizon
      # rtc_consumer_rate_hz: 30                  # async_rtc only; converts latency → inference_delay ticks
      # Upper clamp on RTC guidance weight (server side). With the prefix now
      # normalized into model-space by Policy._rtc_action_normalizer, a
      # moderate value (1–2) should keep the guided v_t on the same side as
      # the base v_t while still tracking the prefix. If the arm is still
      # jerky, drop to 0.5. If the [rtc] log shows |corr| << |v_t| and
      # chunk-boundary jitter persists, raise to 3–5.
      # rtc_max_guidance_weight: 4.0
      # rtc_debug controls the CLIENT-side chunk-jump log. Server-side per-
      # denoising-step stats are controlled independently by the RTC_DEBUG
      # env var on the server process (those prints add real latency via
      # host-device sync so they're OFF by default):
      #   RTC_DEBUG=1 uv run scripts/serve_policy.py ...
      # To see whether the server is re-JIT'ing every inference (bad!):
      #   JAX_LOG_COMPILES=1 uv run scripts/serve_policy.py ...
      # Each compile prints one log line — you should see it at startup, then
      # once more on the first RTC inference, then nothing for subsequent ones.
      # rtc_debug: true
      # Siemens training used resize-with-pad and reversed each arm.s six
      # joints while preserving its gripper slot. The agent applies the same
      # transform to policy inputs and inverts it on returned model actions, so
      # DAgger and RobotNode continue to operate in normal motor order.
      image_preprocess: pad                     # center_crop | pad
      use_joint_state_as_action: false
      flip_joint_order: true
    state_topics:
      left:  yam_left/joint_state       # flatten → left-joint_pos, left-gripper_pos
      right: yam_right/joint_state
    image_topics:
      left_camera:  camera_left/rgb     # flatten → left_camera-images-rgb
      right_camera: camera_right/rgb
      top_camera:   camera_top/rgb
    loop_mode: fixed_rate
    poll_freq: 30
    # No arm_key: action dict has "left"/"right" → fans out to openpi_policy/left_pos and /right_pos.
    # These are no longer wired straight to the arms — the dagger node arbitrates.
    #
    # On handback the arbiter publishes dagger/policy_reset once, which makes
    # AgentNode call AsyncDiffusionAgent.reset() → drops last_actions and resets
    # the ActionChunkBroker. Without it the first post-handback chunk was
    # inferred from an observation taken before the operator intervened.
    reset_topic: dagger/policy_reset

  # ── DAgger arbiter ────────────────────────────────────────────────────────
  # Owns both passive GELLO leaders (CAN), the mode FSM, and the follower IK.
  # Reads the policy's commands off the bus rather than running inference.
  - type: AgentNode
    name: dagger
    agent_class: robots_realtime.agents.teleoperation.dagger_intervention_agent:DaggerInterventionAgent
    agent_kwargs:
      left_channel: can_lead_l
      right_channel: can_lead_r
      # Device 6 carries both switches in its 0x50F digital_inputs byte.
      # Debouncing uses kernel CAN timestamps, so host scheduling and different
      # encoder report rates cannot stretch a press into apparent seconds.
      button_debounce_s: 0.02
      # Must match the passive-gello teleop config for this station.
      joint_signs: [-1, -1, 1, 1, -1, -1]
      # One station-level source of truth for the physical follower limits. The
      # DAgger IK stays another 0.1 rad inside these bounds, matching Market42's
      # solver constraint plus explicit post-solve guard pattern.
      joint_limits: &dagger_follower_joint_limits
        - [-2.09, 3.14]
        - [0.00, 3.14]
        - [0.05, 3.14]
        - [-1.35, 1.35]
        - [-1.50, 1.50]
        - [-2.00, 2.00]
      joint_limit_margin: 0.10
      include_gripper: true
      # YELLOW, the top button. Takeover gets the yellow one because it's the
      # action used most within a rollout and a mispress is cheap — press again
      # to hand back. Swap the two indices if the ergonomics feel wrong.
      takeover_button_index: 0    # bit 0 = top = yellow
      # WHITE, the lower button ("grip" in i2rt's naming): press to start the
      # episode, press again to end and save it. Must differ from
      # takeover_button_index — the gello only has two switches. Set to null to
      # disable and drive recording from the TUI only.
      episode_button_index: 1     # bit 1 = lower = white
      episode_button_arm: left     # only the left GELLO can end/start episodes
      # The same physical lower switch on the right GELLO toggles the Session
      # pause gate. Pausing ends+saves the active episode; resuming starts a new
      # episode and hands the arms back to the policy, exactly like TUI [space].
      pause_button_index: 1
      pause_button_arm: right
      # Start an episode on unpause and end it on pause. This replaces Session's
      # own record_on_unpause (which must stay false above) so that exactly one
      # thing owns episode boundaries.
      record_on_unpause: true
      # ── Rollout cycle ──────────────────────────────────────────────────────
      # Ending a rollout walks the arms back here and parks them, so you get a
      # safe unrecorded window to reset the scene without the policy flailing at
      # it. Press white again to start the next episode.
      #
      # MUST match the RobotNodes' startup_joint_pos below — the agent has no way
      # to read that off them, so the pose is unfortunately stated twice. If you
      # change one, change the other.
      # Median frame-0 follower poses from siemens_simple_d405_v4, converted
      # from the dataset's flipped joint order into physical motor order:
      # left:  [0.0170, 1.5188, 0.2478, 1.1713, -0.1822, -0.1001, 1.0]
      # right: [0.0467, 1.4975, 0.2386, 1.1568, 0.1677, 0.0303, 1.0]
      home_joint_pos: [0.0, 0.4, 0.35, 0.35, 0.0, 0.0, 1.0]
      home_on_episode_end: true
      # Gentler than max_joint_speed: this motion runs unattended while the
      # operator is looking at the scene rather than the arms.
      homing_max_joint_speed: 1.0
      home_tol_rad: 0.03
      # Handback: hold the operator's pose until a post-flush policy command
      # lands, then blend to it over this long. Raise if handback feels abrupt.
      handback_blend_s: 1.0
      handback_fresh_timeout_s: 1.5
      # Slew/smoothing, same scheme as YamPyrokiViserAgent. Treat max_joint_speed
      # as a GLITCH guard, not a comfort knob — it bounds one tick's motion if a
      # leader encoder reports garbage, and setting it low does not make teleop
      # feel safer, it makes it feel broken. Measured tracking gain at a 1.5 rad/s
      # hand speed: 0.83 at 2.0 (reads as "the scale is wrong"), 0.98 at 3.0,
      # 0.99 at 6.0. The URDF joint velocity limit is 10 rad/s, so 6.0 keeps
      # headroom while capping a single 100 Hz tick at 60 mrad.
      max_joint_speed: 6.0
      max_gripper_speed: 4.0
      smoothing_tau_s: 0.01
      # Pull toward the previous solution so the IK stays on one branch
      # (elbow-up vs elbow-down flips would show up as lunges).
      ik_seed_weight: 0.5
      # QUALITY threshold: a solve missing by more than this flags ik_ok: false in
      # dagger/control_mode so the stretch can be filtered in post, but the arm
      # keeps tracking the closest reachable pose. It has to — the target goes
      # unreachable the moment the operator pushes past a joint limit, and
      # freezing the arm there reads as the rig being broken.
      ik_pos_tol_m: 0.02
      ik_ori_tol_rad: 0.2
      # SANITY threshold, much larger: this far off is a solver blow-up rather
      # than a workspace edge, so hold the last accepted solution instead.
      ik_reject_pos_m: 0.15
      # Leader considered dead after this long with no CAN frame. While
      # intervening we then HOLD rather than hand back — silently re-arming the
      # policy mid-correction is the worse failure.
      gello_stale_s: 0.5
    state_topics:
      rehome_request: session/rehome
      left:         yam_left/joint_state
      right:        yam_right/joint_state
      policy_left:  openpi_policy/left_pos
      policy_right: openpi_policy/right_pos
    loop_mode: fixed_rate
    # IK measures ~0.2 ms/solve on CPU, so 2 arms at 100 Hz is ~4% of the budget.
    # RobotNode still polls at 200 Hz and re-commands the latest value.
    poll_freq: 100

  - type: RobotNode
    name: yam_left
    robot_config: robot_configs/yam/xdof_hq/left.yaml
    # Station/policy-specific controller tuning; overrides the shared robot YAML.
    robot_config_overrides:
      joint_limits: *dagger_follower_joint_limits
      # Match Market42 by including the linear 4310 gripper mass in the
      # MuJoCo dynamics model; the arm-only XML makes link_6 nearly massless.
      xml_path:
        _target_: i2rt.robots.utils.combine_arm_and_gripper_xml
        arm_path: dependencies/i2rt/i2rt/robot_models/arm/yam/yam.xml
        gripper_path: dependencies/i2rt/i2rt/robot_models/gripper/linear_4310/linear_4310.xml
      use_gravity_comp: true
      gravity_comp_factor: 1.3
    cmd_topic: dagger/left_pos
    poll_freq: 200
    ramp_duration_s: 1.5
    # startup_joint_pos: [-0.0235, 1.36242, 0.3495, 0.95763, -0.11537, -0.02913, 1.0]
    # v4 median: [0.0170, 1.5188, 0.2478, 1.1713, -0.1822, -0.1001, 1.0]
    startup_joint_pos: [0.0, 0.4, 0.35, 0.35, 0.0, 0.0, 1.0]
    startup_duration_s: 2.0

  - type: RobotNode
    name: yam_right
    robot_config: robot_configs/yam/xdof_hq/right.yaml
    # Keep both follower arms on the same station-specific gravity model.
    robot_config_overrides:
      joint_limits: *dagger_follower_joint_limits
      # Match Market42 by including the linear 4310 gripper mass in the
      # MuJoCo dynamics model; the arm-only XML makes link_6 nearly massless.
      xml_path:
        _target_: i2rt.robots.utils.combine_arm_and_gripper_xml
        arm_path: dependencies/i2rt/i2rt/robot_models/arm/yam/yam.xml
        gripper_path: dependencies/i2rt/i2rt/robot_models/gripper/linear_4310/linear_4310.xml
      use_gravity_comp: true
      gravity_comp_factor: 1.3
    cmd_topic: dagger/right_pos
    poll_freq: 200
    ramp_duration_s: 1.5
    # startup_joint_pos: [0.01732, 1.34234, 0.33567, 0.98454, 0.11514, 0.03717, 1.0]
    # v4 median: [0.0467, 1.4975, 0.2386, 1.1568, 0.1677, 0.0303, 1.0]
    startup_joint_pos: [0.0, 0.4, 0.35, 0.35, 0.0, 0.0, 1.0]
    startup_duration_s: 2.0

  # Three Intel RealSense D405s using the current Siemens station mapping.
  # Attachment was validated on 2026-09-02: 427622273494 is top,
  # 427622271411 is the left wrist, and 427622273554 is the right wrist.
  # Keep left/right aligned with the physical mounts: crossing them would not
  # fail startup, but would silently feed mirrored wrist views to the policy.
  #
  # publish_resize shrinks the bus payload to the policy's input size
  # (224×224) so VGA frames don't get serialized + shipped over ZMQ at
  # ~921 KB ea × 3 cams × 30 Hz. The on-disk MP4 keeps the full-res frame —
  # only the bus copy is downsized. Mode MUST match the agent's
  # image_preprocess setting above so what hits the policy matches the
  # training augmentation.
  #
  # Siemens training used the full D405 FOV, so publish_fov_crop remains 1.0
  # for all three views. Padding preserves that FOV with letterboxing.
  - type: CameraNode
    name: camera_top
    driver: RealSenseCamera
    device_id: "427622273494"
    resolution: VGA
    fps: 30
    publish_resize: [224, 224]
    publish_resize_mode: pad
    publish_fov_crop: 1.0

  - type: CameraNode
    name: camera_left
    driver: RealSenseCamera
    device_id: "427622271411"
    resolution: VGA
    fps: 30
    publish_resize: [224, 224]
    publish_resize_mode: pad
    publish_fov_crop: 1.0

  - type: CameraNode
    name: camera_right
    driver: RealSenseCamera
    device_id: "427622273554"
    resolution: VGA
    fps: 30
    publish_resize: [224, 224]
    publish_resize_mode: pad
    publish_fov_crop: 1.0

  # Live viser monitor — URDF overlays + camera panels, no commands.
  - type: ViserMonitorNode
    name: viz
    port: 8080
    viz_freq: 20
    # Frames from openpi_policy/image/* are already 224×224 (center-cropped by
    # the agent). Match preview to the same square so resize_with_pad is a
    # no-op — otherwise it letterboxes with black bars.
    preview_size: [224, 224]
    auto_open_browser: true
    fullscreen: true
    up_axis: "+z"
    initial_camera_position: [-0.7, -0.31, 0.3]  # behind the arms, slightly elevated
    initial_camera_look_at:  [0.45, -0.31, 0.3]  # workspace centre between the two bases
    # Action-chunk prediction overlay: viser renders N small axes frames along
    # the FK-projected end-effector path for each arm so you can see where the
    # policy intends to take the arms over the next ~1 s of lookahead. Axes
    # shrink with chunk index (nearer future larger, farther future smaller).
    chunk_topic: openpi_policy/chunk
    n_chunk_frames: 10
    chunk_frame_axes_length: 0.03
    urdfs:
      yam_left:
        path: dependencies/i2rt/i2rt/robot_models/arm/yam/yam.urdf
        state_topic: yam_left/joint_state
        flip_joints: true
        chunk_arm_key: left                # matches the agent's chunk payload
        gripper:
          type: linear_4310
          attach_link: link_6
          # Tune if the gripper rendering looks rotated relative to the real arm.
          # body_offset_pos:       [0.0, 0.0, 0.0]
          # body_offset_quat_wxyz: [0.0, 0.0, 0.0, 1.0]   # 180° about Z = joint6 axis
      yam_right:
        path: dependencies/i2rt/i2rt/robot_models/arm/yam/yam.urdf
        state_topic: yam_right/joint_state
        flip_joints: true
        chunk_arm_key: right
        gripper:
          type: linear_4310
          attach_link: link_6
          # Tune if the gripper rendering looks rotated relative to the real arm.
          # body_offset_pos:       [0.0, 0.0, 0.0]
          # body_offset_quat_wxyz: [0.0, 0.0, 0.0, 1.0]   # 180° about Z = joint6 axis
        extrinsic:
          position: [0.0, -0.61, 0.0]
          rotation: [1.0, 0.0, 0.0, 0.0]
    # Subscribe to the agent's republished, preprocessed frames — the exact
    # images the policy consumes (post padding, 224×224, uint8). This
    # avoids running the preprocessing pipeline a second time inside the
    # monitor and guarantees visual fidelity to the model input.
    image_topics:
      top:   openpi_policy/image/top_camera
      left:  openpi_policy/image/left_camera
      right: openpi_policy/image/right_camera
