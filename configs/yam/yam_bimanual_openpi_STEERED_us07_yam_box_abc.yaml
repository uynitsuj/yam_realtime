version: "1"

# STEERED variant of yam_bimanual_openpi_policy_xdof_hq_us07_yam_box_abc.yaml.
#
# Identical hardware/camera/URDF wiring; the ONLY differences are the agent class
# (FkSteeredAgent instead of AsyncDiffusionAgent), its steering kwargs, and an
# `anchor` state topic. Kept as a separate file so the known-good policy config
# is never the thing being experimented on.
#
# HOW TO RUN A STEERED ROLLOUT
# ----------------------------
#   1. With the session STOPPED (grounding needs the top camera to itself):
#        ./.venv-vlm/bin/python scripts/anchor_command.py ground --command "green bottles only"
#      -> writes out/anchors.json (base-frame anchors) + out/anchors.png overlay.
#      CHECK THE OVERLAY before continuing: a wrong anchor steers the arm at the
#      wrong thing, and nothing downstream can catch that.
#
#   2. Start this session. It comes up start_paused; hit [space] to hand over.
#
#   3. In another terminal:
#        uv run scripts/anchor_command.py publish
#      Publishes one anchor at a time on anchor_cmd/point, advancing when the
#      commanded arm's gripper closes near it (ENTER to skip).
#
# Set steer_mode: dryrun below to score candidates and LOG what selection would
# pick while executing candidate 0 — same rollout, no influence on the arm.
#
# Bimanual YAM policy deployment via an external OpenPI websocket inference server.
# The policy agent runs inference on a background thread (inference_mode: async = flat-out);
# AgentNode's consumer calls act() at poll_freq and dequeues one action per tick from the
# chunk buffer. Smoothing across chunk boundaries is handled inside the agent.
#
# Deployment counterpart of yam_bimanual_viser_teleop_xdof_hq_us05_yam_box_abc.yaml
# — same station, same hardware IDs, so a checkpoint trained on data collected
# with that teleop config sees the same cameras in the same roles.
#
# Hardware (us05, surveyed 2026-08-20):
#   CAN — two CANable 2.5 adapters, named by USB serial:
#     208237984546500A -> can_left   (left  follower)
#     207B34A158455017 -> can_right  (right follower)
#   Bring them up with ./scripts/setup_can_yam_bimanual_us05.sh (kernel names
#   are enumeration-order dependent; the script pins them by serial).
#   Cameras — three Intel RealSense D405s (re-surveyed on us07 2026-09-01 by
#   enumerating pyrealsense2 and matching each wrist frame against the
#   overhead view; the two wrist serials inherited from us05 — 427622271411
#   and 427622273554 — are NOT present on this machine):
#     427622273855  top    (overhead)
#     218722271050  left   (left  arm wrist)
#     218622275506  right  (right arm wrist)
#
# Prereqs:
#   - `openpi_client` installed in this venv.
#   - OpenPI server reachable at the (ip, port) below.
#   - can_left / can_right up at 1 Mbit/s (see the script above).

session:
  # {policy_name} is resolved at startup by querying the OpenPI server's
  # websocket metadata (runtime/config.py:_resolve_policy_name). serve_policy.py
  # reports the served checkpoint's name — the named-checkpoint key, or
  # <config>/<run>/<step> for a raw ckpt — so each policy's rollouts land in
  # their own folder. Falls back to the literal template if the server is down.
  save_root: recordings/{policy_name}
  # Policy-specific safety + ergonomics:
  #   - start_paused: RobotNode commands are gated on startup so the arm doesn't
  #     snap to wherever the policy thinks it should be. Hit [space] in the TUI
  #     to hand off control.
  #   - record_on_unpause: when the operator unpauses, automatically start an
  #     episode so every rollout is captured from the instant of handoff.
  start_paused: true
  record_on_unpause: true
  episode_timeout: 240

nodes:
  - type: AgentNode
    name: openpi_policy
    agent_class: robots_realtime.agents.policy_learning.fk_steered_agent:FkSteeredAgent
    #
    # ── FK-objective steering (anchor P0) ────────────────────────────────────
    # Swap the agent_class above for the line below to enable point-prompt
    # steering: K candidate chunks per inference, each scored by the closest
    # approach of its FK hand path to a commanded 3-D anchor, best one executed.
    #
    #   agent_class: robots_realtime.agents.policy_learning.fk_steered_agent:FkSteeredAgent
    #
    # then add to agent_kwargs:
    #   steer_mode: dryrun          # off | dryrun | on. START AT DRYRUN: it
    #                               # scores K candidates and LOGS which one it
    #                               # would pick, while executing candidate 0 —
    #                               # a paired comparison at zero risk to the arm.
    #   n_candidates: 16            # real-time ceiling at 500 ms / 30 Hz on one
    #                               # 5090 (~25 ms per candidate once the shared
    #                               # image prefix amortises)
    #   n_candidates_first: 32      # the arm is stationary at episode start, so
    #   first_chunks: 2             # latency is free exactly when the target
    #                               # choice is being made
    #   right_base_offset: [0.0, -0.61, 0.0]   # MUST match the viz URDF extrinsic
    #   release_at_grasp: true      # retire the anchor once the commanded gripper
    #                               # closes near it; a stale anchor ranks
    #                               # candidates by distance to an empty table
    #
    # The anchor is commanded as a bus message {"point": [x, y, z]} in the
    # LEFT-ARM BASE frame, wired in via state_topics as `anchor:`. Produce it
    # from the top camera with anchor/experiments/steering/real/steer_command.py
    # plus configs/camera_extrinsics/us07_yam_top_d405.yaml.
    #
    # REQUIRES the openpi K-batching seam (policies/policy.py: the noise's
    # leading dim declares K). The agent verifies it on the first steered call
    # and raises rather than silently selecting among identical candidates.
    #
    # ── AsyncDiffusionAgent kwargs by mode ──────────────────────────────────
    #
    # Knob                    sync     async    async_rate_limited  async_rtc          temporal_ensemble
    # ─────────────────────────────────────────────────────────────────────────────────────────────────
    # action_horizon          used     used     used                used               used
    # inference_interval_s    ignored  opt cap  REQUIRED            ignored (sched.)   ignored
    # min/max_smoothed_actions N/A*    used     used                irrelevant†        N/A‡
    # rtc_execution_horizon   N/A      N/A      N/A                 used               N/A
    # rtc_consumer_rate_hz    N/A      N/A      N/A                 used (EMA)         N/A
    # rtc_max_guidance_weight N/A      N/A      N/A                 used (clamp)       N/A
    # temporal_ensemble_k     N/A      N/A      N/A                 N/A                used
    #
    #   * sync uses openpi's ActionChunkBroker which hard-swaps chunks; no
    #     client-side blend is applied.
    #   † in async_rtc the SERVER aligns new chunks to the action_prefix, so
    #     the client-side linear-ramp blend is redundant. Leaving the knobs
    #     at their defaults is fine — they run harmlessly on the tail of the
    #     new chunk where the server guidance weight is already 0.
    #   ‡ temporal_ensemble is paper-faithful (Zhao et al. ACT): blocking
    #     inference once per consumer tick, then exp(-k * age_index) weighted
    #     average across every chunk that covers tick t. No client-side blend;
    #     replaces the linear-ramp scheme entirely. Requires
    #     inference_time < 1/poll_freq for the consumer rate to hold;
    #     otherwise the loop runs as fast as inference allows.
    #
    # inference_interval_s is a rate cap for `async` only. For `async_rtc`
    # the SCHEDULED trigger paces inference (one per chunk cycle, fired
    # when the buffer has ≈ d_est actions left), which supersedes any rate
    # cap — inference_interval_s is ignored on this path.
    #
    # async_rtc REQUIRES the matching openpi fork with sample_actions_rtc
    # and obs["action_prefix"] plumbing (openpi/src/openpi/{policies/policy.py,
    # models/pi0.py}). With stock openpi, use async or async_rate_limited.
    # temporal_ensemble works against any openpi server (stock or fork).
    #
    agent_kwargs:
      ip: 127.0.0.1
      port: 8012
      action_horizon: 15
      inference_mode: sync                 # sync | async | async_rate_limited | async_rtc | temporal_ensemble
      # inference_interval_s: 0.7                 # rate cap in seconds (None = flat-out async)
      # min_smoothed_actions: 1                 # only meaningful for async / async_rate_limited
      # max_smoothed_actions: 10                # (ignored in sync and effectively unused in async_rtc)
      # temporal_ensemble_k: 0.05               # ACT paper default; higher = more weight on older predictions (smoother, laggier)
      # rtc_execution_horizon: 22               # async_rtc only; None → server's action_horizon
      # rtc_consumer_rate_hz: 30                  # async_rtc only; converts latency → inference_delay ticks
      # Upper clamp on RTC guidance weight (server side). With the prefix now
      # normalized into model-space by Policy._rtc_action_normalizer, a
      # moderate value (1–2) should keep the guided v_t on the same side as
      # the base v_t while still tracking the prefix. If the arm is still
      # jerky, drop to 0.5. If the [rtc] log shows |corr| << |v_t| and
      # chunk-boundary jitter persists, raise to 3–5.
      # rtc_max_guidance_weight: 4.0
      # rtc_debug controls the CLIENT-side chunk-jump log. Server-side per-
      # denoising-step stats are controlled independently by the RTC_DEBUG
      # env var on the server process (those prints add real latency via
      # host-device sync so they're OFF by default):
      #   RTC_DEBUG=1 uv run scripts/serve_policy.py ...
      # To see whether the server is re-JIT'ing every inference (bad!):
      #   JAX_LOG_COMPILES=1 uv run scripts/serve_policy.py ...
      # Each compile prints one log line — you should see it at startup, then
      # once more on the first RTC inference, then nothing for subsequent ones.
      # rtc_debug: true
      # Image pre-processing MUST match the training augmentation for your
      # checkpoint. Lab42 / PI OpenPI YAM runs use center-crop (crop to a
      # min(H,W) square from centre, then resize). resize_with_pad adds
      # black bars which are OOD for the model → erratic actions.
      image_preprocess: center_crop             # center_crop | pad
      use_joint_state_as_action: false
      # ── FK-objective steering ─────────────────────────────────────────────
      # QUOTED deliberately: YAML 1.1 parses bare on/off as BOOLEANS.
      steer_mode: "on"                  # "off" | "dryrun" | "on"
      n_candidates: 16                  # 413 ms — fits the 500 ms chunk budget
      n_candidates_first: 32            # 800 ms; the arm is still ~stationary
      first_chunks: 2                   # for the first couple of decisions
      right_base_offset: [0.0, -0.61, 0.0]   # matches the viz URDF extrinsic
      arm_gate_band: 0.10               # |y - midline| beyond this scores one arm
      release_at_grasp: true
      release_radius_m: 0.12
      steer_seed: 0                     # hold K and seed fixed within a comparison
    state_topics:
      left:  yam_left/joint_state       # flatten → left-joint_pos, left-gripper_pos
      right: yam_right/joint_state
      # Commanded 3-D anchor, {"point": [x, y, z]} in the LEFT-ARM BASE frame,
      # published by scripts/anchor_command.py. No anchor => unsteered inference.
      anchor: anchor_cmd/point
    image_topics:
      left_camera:  camera_left/rgb     # flatten → left_camera-images-rgb
      right_camera: camera_right/rgb
      top_camera:   camera_top/rgb
    loop_mode: fixed_rate
    poll_freq: 30
    # No arm_key: action dict has "left"/"right" → fans out to openpi_policy/left_pos and /right_pos.

  - type: RobotNode
    name: yam_left
    robot_config: robot_configs/yam/xdof_hq/left.yaml
    cmd_topic: openpi_policy/left_pos
    # Second command source: the viser gizmo teleop in the `viz` node below.
    # RobotNode takes whichever topic is FRESHEST; the session guarantees only
    # one source publishes at a time, so this needs no mode knowledge here.
    # A source handover forces the ramp_duration_s ease-in.
    teleop_cmd_topic: viz/left_pos
    poll_freq: 200
    ramp_duration_s: 1.5
    # startup_joint_pos: [-0.0235, 1.36242, 0.3495, 0.95763, -0.11537, -0.02913, 1.0]
    startup_joint_pos: [0.0, 0.4 , 0.35, 0.35, 0.0, 0.0, 1.0]
    startup_duration_s: 2.0

  - type: RobotNode
    name: yam_right
    robot_config: robot_configs/yam/xdof_hq/right.yaml
    cmd_topic: openpi_policy/right_pos
    teleop_cmd_topic: viz/right_pos
    poll_freq: 200
    ramp_duration_s: 1.5
    # startup_joint_pos: [0.01732, 1.34234, 0.33567, 0.98454, 0.11514, 0.03717, 1.0]
    startup_joint_pos: [0.0, 0.4, 0.35, 0.35, 0.0, 0.0, 1.0]
    startup_duration_s: 2.0

  # Three Intel RealSense D405s. Same ROLES as
  # yam_bimanual_viser_teleop_xdof_hq_us05_yam_box_abc.yaml, but the two wrist
  # serials differ — that config's wrist cams live on us05. The left/right
  # assignment below matches yam_bimanual_act_policy_xdof_hq.yaml and the _jam
  # configs; note yam_bimanual_openpi_policy_xdof_hq_us05.yaml has these two
  # swapped and is stale for this station.
  # Swap the device_id values if the physical mounts don't match the labels.
  #
  # NOTE: publish_fov_crop below is 0.88 on the top camera, while the box_abc
  # teleop config records at 0.92. Deployment must match whatever produced the
  # training data for this checkpoint — set both to the same value once you
  # know which one the episodes were collected with.
  #
  # publish_resize shrinks the bus payload to the policy's input size
  # (224×224) so VGA frames don't get serialized + shipped over ZMQ at
  # ~921 KB ea × 3 cams × 30 Hz. The on-disk MP4 keeps the full-res frame —
  # only the bus copy is downsized. Mode MUST match the agent's
  # image_preprocess setting above so what hits the policy matches the
  # training augmentation.
  #
  # publish_fov_crop (fraction in (0, 1], default 1.0 = off) artificially
  # narrows the FOV by center-cropping BEFORE the resize — a deployment knob
  # to match the policy input to the FOV the model was trained on without
  # changing optics. 0.85 keeps the central 85% of each axis (~15% tighter
  # FOV / slight zoom-in); applied to the bus/policy frame only — the on-disk
  # recording stays full FOV. Keep it identical across all 3 cams unless you
  # deliberately want them mismatched.
  - type: CameraNode
    name: camera_top
    driver: RealSenseCamera
    device_id: "427622273855"
    resolution: VGA
    fps: 30
    publish_resize: [224, 224]
    publish_resize_mode: center_crop
    publish_fov_crop: 0.88

  - type: CameraNode
    name: camera_left
    driver: RealSenseCamera
    device_id: "218722271050"
    resolution: VGA
    fps: 30
    publish_resize: [224, 224]
    publish_resize_mode: center_crop
    publish_fov_crop: 1.0

  - type: CameraNode
    name: camera_right
    driver: RealSenseCamera
    device_id: "218622275506"
    resolution: VGA
    fps: 30
    publish_resize: [224, 224]
    publish_resize_mode: center_crop
    publish_fov_crop: 1.0

  # Live viser monitor — URDF overlays + camera panels, AND (via `teleop`
  # below) draggable end-effector gizmos that command the real arms.
  #
  # ── Command modes ────────────────────────────────────────────────────────
  # The "control" folder in the viser GUI selects one of three modes; the
  # Session arbitrates them and is the single source of truth, so the GUI and
  # the TUI space bar cannot disagree:
  #
  #   off     session paused — EVERY source gated at the RobotNode. Identical
  #           to pressing [space] in the TUI. The arms hold their last pose.
  #   teleop  policy agent paused, gizmos drive the arms (once armed).
  #   policy  gizmos silent, the policy drives; gizmos track the measured arm.
  #
  # [space] in the TUI toggles off <-> the previous mode, and the GUI mirrors
  # whatever the session reports on session/state.
  #
  # SAFETY: "gizmos armed" is a separate checkbox that resets to OFF on every
  # mode change and on any session pause. Entering teleop therefore never moves
  # the arm; arming re-syncs the gizmos onto the MEASURED pose first (see
  # YamPyrokiViserAgent.sync_on_start), so the first command is a no-op rather
  # than a jump to wherever the gizmo was last dragged.
  - type: ViserMonitorNode
    name: viz
    port: 8080
    viz_freq: 20
    # Nodes the session must pause while teleop drives — i.e. the policy agent.
    policy_nodes: [openpi_policy]
    teleop:
      bimanual: true
      # Must match the right arm's URDF extrinsic below, or IK targets for the
      # right arm land 0.61 m from where the gizmo appears.
      right_arm_extrinsic:
        position: [0.0, -0.61, 0.0]
        rotation: [1.0, 0.0, 0.0, 0.0]
      ik_rate: 100.0
      # Conservative for a browser-driven real arm; raise once it feels right.
      max_joint_speed: 1.0
      max_gripper_speed: 4.0
      smoothing_tau_s: 0.05
      sync_on_start: true
    # Frames from openpi_policy/image/* are already 224×224 (center-cropped by
    # the agent). Match preview to the same square so resize_with_pad is a
    # no-op — otherwise it letterboxes with black bars.
    preview_size: [224, 224]
    auto_open_browser: true
    fullscreen: true
    up_axis: "+z"
    initial_camera_position: [-0.7, -0.31, 0.3]  # behind the arms, slightly elevated
    initial_camera_look_at:  [0.45, -0.31, 0.3]  # workspace centre between the two bases
    # Action-chunk prediction overlay: viser renders N small axes frames along
    # the FK-projected end-effector path for each arm so you can see where the
    # policy intends to take the arms over the next ~1 s of lookahead. Axes
    # shrink with chunk index (nearer future larger, farther future smaller).
    chunk_topic: openpi_policy/chunk
    n_chunk_frames: 10
    chunk_frame_axes_length: 0.03
    urdfs:
      yam_left:
        path: dependencies/i2rt/i2rt/robot_models/arm/yam/yam.urdf
        state_topic: yam_left/joint_state
        flip_joints: true
        chunk_arm_key: left                # matches the agent's chunk payload
        gripper:
          type: linear_4310
          attach_link: link_6
          # Tune if the gripper rendering looks rotated relative to the real arm.
          # body_offset_pos:       [0.0, 0.0, 0.0]
          # body_offset_quat_wxyz: [0.0, 0.0, 0.0, 1.0]   # 180° about Z = joint6 axis
      yam_right:
        path: dependencies/i2rt/i2rt/robot_models/arm/yam/yam.urdf
        state_topic: yam_right/joint_state
        flip_joints: true
        chunk_arm_key: right
        gripper:
          type: linear_4310
          attach_link: link_6
          # Tune if the gripper rendering looks rotated relative to the real arm.
          # body_offset_pos:       [0.0, 0.0, 0.0]
          # body_offset_quat_wxyz: [0.0, 0.0, 0.0, 1.0]   # 180° about Z = joint6 axis
        extrinsic:
          position: [0.0, -0.61, 0.0]
          rotation: [1.0, 0.0, 0.0, 0.0]
    # Subscribe to the agent's republished, preprocessed frames — the exact
    # images the policy consumes (post center-crop, 224×224, uint8). This
    # avoids running the preprocessing pipeline a second time inside the
    # monitor and guarantees visual fidelity to the model input.
    image_topics:
      top:   openpi_policy/image/top_camera
      left:  openpi_policy/image/left_camera
      right: openpi_policy/image/right_camera
