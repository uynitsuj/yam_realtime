version: "1"

# us05 deployment contract for the OpenPI checkpoint:
#   config: pi05_siemens_simple_d405_bs128
#   run:    siemens_simple_d405_pi05_20260901
#   step:   14999
#
# The training converter used three D405 views at 30 Hz, 224x224
# resize-with-pad, no FOV crop, and the LeRobot YAM joint convention:
# flip(left 6 joints), left gripper, flip(right 6 joints), right gripper.
# Keep the pad/crop and flip settings below together; changing only one makes
# live observations or commands inconsistent with the checkpoint statistics.
#
# OpenPI server (matching NFS worktree):
#   cd /nfs_us_2/karim/worktrees/openpi-industrial-packing-v3
#   uv run scripts/serve_policy.py --default-prompt "industrial packing" policy:checkpoint \
#     --policy.config=pi05_siemens_simple_d405_bs128 \
#     --policy.dir=/nfs_us_2/siemens/policy_ckpts/pi05_siemens_simple_d405_bs128/siemens_simple_d405_pi05_20260901/14999

session:
  save_root: recordings/{policy_name}
  start_paused: true
  record_on_unpause: true
  episode_timeout: 240

nodes:
  - type: AgentNode
    name: openpi_policy
    agent_class: robots_realtime.agents.policy_learning.async_pi0_agent:AsyncDiffusionAgent
    agent_kwargs:
      ip: 127.0.0.1
      port: 8012
      # Match Pi0Config(action_horizon=30) instead of discarding the last ten
      # predictions as the generic us05 20-step broker does.
      action_horizon: 30
      inference_mode: sync
      image_preprocess: pad
      use_joint_state_as_action: false
      # Send the exact training-time language condition explicitly instead of
      # relying only on the server's config-derived default.
      prompt: industrial packing
      # Map live motor order -> LeRobot training order on input and invert the
      # mapping on model actions before publishing robot commands.
      flip_joint_order: true
    state_topics:
      left: yam_left/joint_state
      right: yam_right/joint_state
    image_topics:
      left_camera: camera_left/rgb
      right_camera: camera_right/rgb
      top_camera: camera_top/rgb
    loop_mode: fixed_rate
    poll_freq: 30

  - type: RobotNode
    name: yam_left
    robot_config: robot_configs/yam/xdof_hq/left.yaml
    cmd_topic: openpi_policy/left_pos
    poll_freq: 200
    ramp_duration_s: 1.5
    # startup_joint_pos: [0.0, 0.4, 0.35, 0.35, 0.0, 0.0, 1.0]
    startup_joint_pos: [0.018, 1.519, 0.249, 1.167, -0.170, -0.096, 1.0]
    startup_duration_s: 2.0

  - type: RobotNode
    name: yam_right
    robot_config: robot_configs/yam/xdof_hq/right.yaml
    cmd_topic: openpi_policy/right_pos
    poll_freq: 200
    ramp_duration_s: 1.5
    # startup_joint_pos: [0.0, 0.6, 0.55, 0.35, 0.0, 0.0, 1.0]
    startup_joint_pos: [0.047, 1.497, 0.238, 1.157, 0.171, 0.031, 1.0]
    startup_duration_s: 2.0

  # Current us05 D405 mapping from the generic us05 config. Confirm the
  # physical camera labels before unpausing if hardware has been moved.
  - type: CameraNode
    name: camera_top
    driver: RealSenseCamera
    device_id: "427622273494"
    resolution: VGA
    fps: 30
    publish_resize: [224, 224]
    publish_resize_mode: pad
    publish_fov_crop: 1.0

  - type: CameraNode
    name: camera_left
    driver: RealSenseCamera
    device_id: "427622273554"
    resolution: VGA
    fps: 30
    publish_resize: [224, 224]
    publish_resize_mode: pad
    publish_fov_crop: 1.0

  - type: CameraNode
    name: camera_right
    driver: RealSenseCamera
    device_id: "427622271411"
    resolution: VGA
    fps: 30
    publish_resize: [224, 224]
    publish_resize_mode: pad
    publish_fov_crop: 1.0

  - type: ViserMonitorNode
    name: viz
    port: 8080
    viz_freq: 20
    preview_size: [224, 224]
    auto_open_browser: true
    fullscreen: true
    up_axis: "+z"
    initial_camera_position: [-0.7, -0.31, 0.3]
    initial_camera_look_at: [0.45, -0.31, 0.3]
    chunk_topic: openpi_policy/chunk
    n_chunk_frames: 10
    chunk_frame_axes_length: 0.03
    urdfs:
      yam_left:
        path: dependencies/i2rt/i2rt/robot_models/arm/yam/yam.urdf
        state_topic: yam_left/joint_state
        flip_joints: true
        chunk_arm_key: left
        gripper:
          type: linear_4310
          attach_link: link_6
      yam_right:
        path: dependencies/i2rt/i2rt/robot_models/arm/yam/yam.urdf
        state_topic: yam_right/joint_state
        flip_joints: true
        chunk_arm_key: right
        gripper:
          type: linear_4310
          attach_link: link_6
        extrinsic:
          position: [0.0, -0.61, 0.0]
          rotation: [1.0, 0.0, 0.0, 0.0]
    image_topics:
      top: openpi_policy/image/top_camera
      left: openpi_policy/image/left_camera
      right: openpi_policy/image/right_camera
