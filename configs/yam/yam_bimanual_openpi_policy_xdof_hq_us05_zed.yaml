version: "1"

# Bimanual YAM policy deployment on us05 with three Stereolabs ZED cameras, driven by an external
# OpenPI websocket inference server (pi0.5 "siemens industrial packing" checkpoint).
#
# Server (in ~/openpi):
#   uv run scripts/serve_policy.py --config pi05_siemens_industrial_packing_bs128 \
#     --checkpoint-dir /nfs_us_2/siemens/policy_ckpts/pi05_siemens_industrial_packing_bs128/siemens_packing_pi05_lerobot_20260825/14999 \
#     --default-prompt "<task_name the episodes were collected with>" --port 8012
# Client (in ~/robots_realtime):
#   uv run rr-session configs/yam/yam_bimanual_openpi_policy_xdof_hq_us05_zed.yaml
#
# Prereqs:
#   - ./scripts/setup_zed.sh passed (ZED SDK readable, `pyzed` in the venv).
#   - `uv run scripts/probe_zed_cameras.py --yaml` lists your three serials; paste them below and
#     check /tmp/zed_probe/*_policy224.jpg to confirm which serial is mounted where.
#   - can_left / can_right up at 1 Mbit/s.
#
# Image pipeline (MUST match training). The checkpoint was trained on data converted by lab42's
# LeRobot converter (xdof/learning/datasets/lerobot/default_configs.py), which letterboxes every
# camera to 224x224 with `resize_and_pad` (no centre crop, full FOV). The top camera in that data
# is the left eye of a ZED. So:
#   - CameraNode.publish_resize_mode: pad     (bus payload = 224x224 letterboxed frame)
#   - AsyncDiffusionAgent.image_preprocess: pad  (idempotent on an already-padded 224x224 frame)
#   - publish_fov_crop: 1.0                   (any crop would change the FOV vs. training)
# Do NOT switch either of these to center_crop for this checkpoint.

session:
  # {policy_name} is filled from the server's websocket metadata (serve_policy.py reports
  # <config>/<run>/<step>) so each checkpoint's rollouts land in their own folder.
  save_root: recordings/{policy_name}
  start_paused: true          # arms hold their startup pose until you press [space] in the TUI
  record_on_unpause: true     # every rollout is captured from the instant of handoff
  episode_timeout: 240

nodes:
  - type: AgentNode
    name: openpi_policy
    agent_class: robots_realtime.agents.policy_learning.async_pi0_agent:AsyncDiffusionAgent
    agent_kwargs:
      ip: 127.0.0.1
      port: 8012
      # Actions executed per inference. The server returns model.action_horizon (30 for this
      # config) steps at 30 Hz; executing 20 then re-inferring keeps the arm on fresh predictions.
      action_horizon: 20
      inference_mode: sync                # sync | async | async_rate_limited | async_rtc | temporal_ensemble
      # See yam_bimanual_openpi_policy_xdof_hq_us05.yaml for the full knob table of the other modes.
      image_preprocess: pad               # matches resize_and_pad in the LeRobot conversion
      use_joint_state_as_action: false
    state_topics:
      left:  yam_left/joint_state         # flatten -> left-joint_pos, left-gripper_pos
      right: yam_right/joint_state
    image_topics:
      left_camera:  camera_left/rgb       # flatten -> left_camera-images-rgb  (needs ZedCamera image_key: rgb)
      right_camera: camera_right/rgb
      top_camera:   camera_top/rgb
    loop_mode: fixed_rate
    poll_freq: 30
    # No arm_key: action dict has "left"/"right" -> fans out to openpi_policy/left_pos and /right_pos.

  - type: RobotNode
    name: yam_left
    robot_config: robot_configs/yam/xdof_hq/left.yaml
    cmd_topic: openpi_policy/left_pos
    poll_freq: 200
    ramp_duration_s: 1.5
    startup_joint_pos: [0.0, 0.4, 0.35, 0.35, 0.0, 0.0, 1.0]
    startup_duration_s: 2.0

  - type: RobotNode
    name: yam_right
    robot_config: robot_configs/yam/xdof_hq/right.yaml
    cmd_topic: openpi_policy/right_pos
    poll_freq: 200
    ramp_duration_s: 1.5
    startup_joint_pos: [0.0, 0.4, 0.35, 0.35, 0.0, 0.0, 1.0]
    startup_duration_s: 2.0

  # Three ZED cameras. ZedCamera publishes the LEFT eye under `image_key` -- set to `rgb` so the
  # bus key flattens to <cam>-images-rgb (what the policy expects) and the recording is written as
  # camera_<x>-images-rgb.mp4, same as RealSense stations.
  #
  # device_id = ZED serial (USB ZED 2i / ZED Mini / ZED 2). For a ZED X that lives on a Jetson,
  # replace `device_id` with `stream_ip: "<jetson-ip>:30000"` (ZED SDK streaming sender).
  # HD720 is supported by every ZED model at 30 fps; HD1080/HD1200 also work but triple the USB
  # bandwidth -- three USB ZEDs at 1080p need separate USB 3 root hubs.
  #
  # publish_resize shrinks the bus payload to the 224x224 letterboxed policy input so 720p frames
  # are not serialized over ZMQ 3x at 30 Hz. The on-disk MP4 keeps the full-res frame.
  - type: CameraNode
    name: camera_top
    driver: ZedCamera
    device_id: "ZED_SERIAL_TOP"       # <- from `probe_zed_cameras.py --yaml`
    resolution: HD720
    fps: 30
    image_key: rgb
    publish_resize: [224, 224]
    publish_resize_mode: pad
    publish_fov_crop: 1.0

  - type: CameraNode
    name: camera_left
    driver: ZedCamera
    device_id: "ZED_SERIAL_LEFT"
    resolution: HD720
    fps: 30
    image_key: rgb
    publish_resize: [224, 224]
    publish_resize_mode: pad
    publish_fov_crop: 1.0

  - type: CameraNode
    name: camera_right
    driver: ZedCamera
    device_id: "ZED_SERIAL_RIGHT"
    resolution: HD720
    fps: 30
    image_key: rgb
    publish_resize: [224, 224]
    publish_resize_mode: pad
    publish_fov_crop: 1.0

  # Live viser monitor -- URDF overlays + the exact 224x224 frames the policy consumes.
  - type: ViserMonitorNode
    name: viz
    port: 8080
    viz_freq: 20
    preview_size: [224, 224]
    auto_open_browser: true
    fullscreen: true
    up_axis: "+z"
    initial_camera_position: [-0.7, -0.31, 0.3]
    initial_camera_look_at:  [0.45, -0.31, 0.3]
    chunk_topic: openpi_policy/chunk
    n_chunk_frames: 10
    chunk_frame_axes_length: 0.03
    urdfs:
      yam_left:
        path: dependencies/i2rt/i2rt/robot_models/arm/yam/yam.urdf
        state_topic: yam_left/joint_state
        flip_joints: true
        chunk_arm_key: left
        gripper:
          type: linear_4310
          attach_link: link_6
      yam_right:
        path: dependencies/i2rt/i2rt/robot_models/arm/yam/yam.urdf
        state_topic: yam_right/joint_state
        flip_joints: true
        chunk_arm_key: right
        gripper:
          type: linear_4310
          attach_link: link_6
        extrinsic:
          position: [0.0, -0.61, 0.0]
          rotation: [1.0, 0.0, 0.0, 0.0]
    image_topics:
      top:   openpi_policy/image/top_camera
      left:  openpi_policy/image/left_camera
      right: openpi_policy/image/right_camera
