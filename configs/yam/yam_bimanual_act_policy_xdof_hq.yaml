version: "1"

# Bimanual YAM policy deployment via a local ACT (Action Chunking Transformer) model.
# The policy agent runs inference on a background thread using PyTorch;
# AgentNode's consumer calls act() at poll_freq and dequeues one action per tick from the
# chunk buffer. Smoothing across chunk boundaries is handled inside the agent.
#
# Prereqs:
#   - `act` package installed in this venv (from /path/to/act).
#   - A trained ACT checkpoint (.pt file).
#   - Normalization stats JSON matching the training run.
#   - CUDA GPU available (or set device: cpu for slower inference).

session:
  save_root: recordings
  start_paused: true
  record_on_unpause: false

nodes:
  - type: AgentNode
    name: act_policy
    agent_class: robots_realtime.agents.policy_learning.async_act_agent:AsyncACTAgent
    agent_kwargs:
      # ── Model ──────────────────────────────────────────────────────────
      checkpoint_path: ""                       # Path to trained .pt checkpoint
      norm_stats_path: ""                       # Path to norm_stats.json
      use_quantile_norm: true
      device: cuda

      # ── Architecture (must match training config) ──────────────────────
      action_dim: 14
      proprio_dim: 14
      action_chunk_size: 30
      backbone: dinov3_vits16
      encoder_image_size: 256
      hidden_size: 384
      num_heads: 12
      num_blocks: 3
      relative_actions: false
      freeze_encoder: true

      # ── Inference ──────────────────────────────────────────────────────
      #
      # Knob                      async    async_rate_limited
      # ─────────────────────────────────────────────────────
      # inference_interval_s      opt cap  REQUIRED
      # min/max_smoothed_actions  used     used
      #
      inference_mode: async_rate_limited        # async | async_rate_limited
      inference_interval_s: 0.3
      min_smoothed_actions: 1
      max_smoothed_actions: 8

      # ── Delta actions (must match training config) ─────────────────────
      use_delta_actions: false
      # delta_action_mask: null                 # e.g. [true,...,true,false,true,...,true,false]

      # ── Image preprocessing (must match training augmentation) ─────────
      image_preprocess: center_crop             # center_crop | resize

      use_joint_state_as_action: false
    state_topics:
      left:  yam_left/joint_state
      right: yam_right/joint_state
    image_topics:
      left_camera:  camera_left/rgb
      right_camera: camera_right/rgb
      top_camera:   camera_top/rgb
    loop_mode: fixed_rate
    poll_freq: 30

  - type: RobotNode
    name: yam_left
    robot_config: robot_configs/yam/xdof_hq/left.yaml
    cmd_topic: act_policy/left_pos
    poll_freq: 200
    ramp_duration_s: 1.5
    startup_joint_pos: [-0.0235, 1.56242, 0.3495, 0.95763, -0.11537, -0.02913, 1.0]
    startup_duration_s: 2.0

  - type: RobotNode
    name: yam_right
    robot_config: robot_configs/yam/xdof_hq/right.yaml
    cmd_topic: act_policy/right_pos
    poll_freq: 200
    ramp_duration_s: 1.5
    startup_joint_pos: [0.01732, 1.54234, 0.33567, 0.98454, 0.11514, 0.03717, 1.0]
    startup_duration_s: 2.0

  - type: CameraNode
    name: camera_top
    driver: RealSenseCamera
    device_id: "218622270376"
    resolution: VGA
    fps: 30

  - type: CameraNode
    name: camera_left
    driver: RealSenseCamera
    device_id: "218722271050"
    resolution: VGA
    fps: 30

  - type: CameraNode
    name: camera_right
    driver: RealSenseCamera
    device_id: "218622275506"
    resolution: VGA
    fps: 30

  - type: ViserMonitorNode
    name: viz
    port: 8080
    viz_freq: 20
    auto_open_browser: true
    fullscreen: true
    up_axis: "+z"
    initial_camera_position: [-0.7, -0.31, 0.3]
    initial_camera_look_at:  [0.45, -0.31, 0.3]
    chunk_topic: act_policy/chunk
    n_chunk_frames: 10
    chunk_frame_axes_length: 0.03
    urdfs:
      yam_left:
        path: dependencies/i2rt/i2rt/robot_models/arm/yam/yam.urdf
        state_topic: yam_left/joint_state
        flip_joints: true
        chunk_arm_key: left
        gripper:
          type: linear_4310
          attach_link: link_6
      yam_right:
        path: dependencies/i2rt/i2rt/robot_models/arm/yam/yam.urdf
        state_topic: yam_right/joint_state
        flip_joints: true
        chunk_arm_key: right
        gripper:
          type: linear_4310
          attach_link: link_6
        extrinsic:
          position: [0.0, -0.61, 0.0]
          rotation: [1.0, 0.0, 0.0, 0.0]
    image_topics:
      top:   camera_top/rgb
      left:  camera_left/rgb
      right: camera_right/rgb
