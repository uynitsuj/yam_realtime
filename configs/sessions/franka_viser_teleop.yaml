version: "1"

session:
  save_root: recordings

nodes:
  - type: AgentNode
    name: franka_viser
    agent_class: robots_realtime.agents.teleoperation.franka_pyroki_viser_agent:FrankaPyrokiViserAgent
    agent_kwargs:
      viser_port: 8765
      ik_rate: 100.0
    arm_key: left
    loop_mode: fixed_rate
    poll_freq: 100.0
    state_topics:
      joint_state: franka/joint_state

  - type: RobotNode
    name: franka
    robot_config: robot_configs/franka/franka_no_gripper.yaml
    cmd_topic: franka_viser/joint_pos

  - type: CameraNode
    name: camera_top
    driver: ZedCamera
    device_id: "YOUR_SERIAL"
    resolution: HD720
    fps: 30
